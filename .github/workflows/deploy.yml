# Déploiement backend Render : staging → approbation → production.
#
# Déclenché UNIQUEMENT quand le workflow CI a réussi sur master : les
# tests ne sont plus rejoués ici (ils l'étaient avant, sans les variables
# de config, donc à l'aveugle), et un master rouge ne part plus jamais.
#
# Prérequis côté Render : autoDeploy désactivé sur les deux services
# (cf. render.yaml), sinon Render déploie la prod à chaque push, avant
# et indépendamment de ce workflow et de son approbation.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-render
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging
        # API Render : POST /v1/services/{serviceId}/deploys. L'ancien
        # POST /v1/deploys n'existe pas, et sans --fail curl réussissait
        # sur la réponse d'erreur : le déclenchement échouait en silence.
        run: |
          curl --fail-with-body -sS -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_STAGING }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}' > /dev/null

      - name: Verify Staging Health
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s --max-time 90 "https://${{ secrets.RENDER_STAGING_URL }}/api/health" || true)
            if [[ "$STATUS" == *'"ollama":true'* && "$STATUS" == *'"langgraph":true'* && "$STATUS" == *'"database":true'* ]]; then
              echo "Staging is healthy!"
              exit 0
            fi
            echo "Staging not ready yet ($i/12)... retrying in 30s"
            sleep 30
          done
          echo "Staging health check timed out"
          exit 1

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    # Approbation manuelle portée par l'environnement GitHub `production`
    # (reviewers requis dans Settings → Environments).
    environment: production
    steps:
      - name: Deploy to Production
        run: |
          curl --fail-with-body -sS -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_PROD }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}' > /dev/null

      - name: Verify Production Health
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s --max-time 90 "https://${{ secrets.RENDER_PROD_URL }}/api/health" || true)
            if [[ "$STATUS" == *'"ollama":true'* && "$STATUS" == *'"langgraph":true'* && "$STATUS" == *'"database":true'* ]]; then
              echo "Production is healthy!"
              exit 0
            fi
            echo "Production not ready yet ($i/12)... retrying in 30s"
            sleep 30
          done
          echo "Production health check timed out"
          exit 1
