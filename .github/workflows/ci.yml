# CI/CD Agent-Tutor — garde master déployable.
#
# Contexte : trois poussées consécutives ont cassé la prod ( Render )
# à cause d'imports morts et d'un package PyPI inexistant, et le build
# Vercel était en échec depuis 5 jours à cause d'une fausse détection
# de projet Python. Ce workflow intercepte ces régressions AVANT le
# déploiement automatique de Render et Vercel.
#
# Jobs :
#   - backend  : install requirements.txt, syntaxe ( app + agent/ ),
#                smoke tests d'import, tests
#   - frontend : npm ci + build Vite ( tsc -b && vite build )
name: CI

on:
  push:
    # dev = branche d'intégration (AGENTS.md) : la CI doit y tourner
    # AVANT le merge vers master, pas seulement après.
    branches: [master, dev, "task/**"]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

# Évite l'accumulation de runs sur les pushes successifs d'une même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # BACKEND — Python 3.11 ( même version que l'image Render ).
  # --------------------------------------------------------------------------
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Variables factices au niveau job : `app.config` lève si DATABASE_URL
    # est absente (8356b2d) et plusieurs étapes importent app.* — comme
    # l'étape « Import smoke tests » ci-dessous, le build ne dépend
    # d'aucun secret en CI.
    env:
      AUTH_MODE: neon
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEON_AUTH_BASE_URL: https://example.neon.tech
      JWT_ALGORITHM: RS256

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        # Mêmes versions que l'image Render ( requirements.lock ), puis les
        # outils de test. Échoue si un package n'existe pas sur PyPI.
        run: |
          pip install --no-input -r requirements.lock
          pip install --no-input -r requirements-dev.txt

      - name: Lock à jour
        # requirements.txt modifié sans regénérer le verrou → échec. uv
        # réutilise les versions déjà figées : seul un changement de
        # requirements.txt fait bouger le fichier.
        run: |
          pip install --no-input uv
          grep -v '^#' requirements.lock > requirements.lock.check
          uv pip compile requirements.txt --python-version 3.11 --python-platform x86_64-manylinux_2_28 --no-header -o requirements.lock.check
          grep -v '^#' requirements.lock | diff - requirements.lock.check

      - name: Ruff (erreurs bloquantes uniquement)
        # Syntaxe, noms non définis, imports invalides : ce qui casse au
        # runtime. Le style n'est pas un critère de CI ici.
        run: ruff check app tests scripts --select E9,F63,F7,F82

      - name: Syntax check ( compileall )
        # `../agent` = l'agent LiveKit Cloud ( projet autonome ). Docker
        # Desktop n'est pas requis : compileall ne fait que compiler, il
        # n'importe rien — donc `livekit-agents` n'a pas besoin d'être
        # installé ici.
        run: python -m compileall -q app scripts ../agent

      # Smoke tests d'import : un import mort ( symbole supprimé lors d'un
      # refactor ) fait crasher uvicorn au démarrage. On importe donc les
      # points d'entrée réels pour les valider.
      - name: Import smoke tests
        env:
          # Le démarrage lit la config ; on fournit des valeurs factices
          # pour ne pas dépendre de secrets en CI.
          AUTH_MODE: neon
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEON_AUTH_BASE_URL: https://example.neon.tech
          JWT_ALGORITHM: RS256
        run: |
          python -c "import app.main; print('app.main OK')"
          python -c "import app.infrastructure.livekit; print('livekit helpers OK')"
          python -c "import app.tools; print('tools OK')"
          python -c "import app.graph.main; print('graph OK')"

      # Cohérence façades : chaque __init__ de package de tools doit
      # exposer des symboles qui existent vraiment.
      - name: Check tool registry
        run: python -c "from app.tools import all_tools; assert len(all_tools) > 0; print(f'{len(all_tools)} tools registered')"

      - name: Run tests
        # Bloquant. Les tests @pytest.mark.integration (Neon requis) sont
        # sautés automatiquement : la CI n'a pas de base.
        run: python -m pytest -q --no-header -m "not integration"

      - name: Audit des dépendances (informatif)
        run: pip-audit -r requirements.lock --progress-spinner off
        continue-on-error: true

  # --------------------------------------------------------------------------
  # FRONTEND — build Vite ( tsc -b && vite build ).
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci échoue si package-lock.json n'est pas synchronisé avec
      # package.json — c'est le garde-fou voulu.
      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Build (tsc + vite)
        env:
          # Variables publiques minimales : le build ne doit pas dépendre
          # d'un backend live pour réussir.
          VITE_API_URL: http://localhost:8000
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
