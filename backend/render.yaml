# Configuration Render — agent-tutor.
#
# ⚠️ Ce fichier est une SOURCE DE VÉRITÉ en plus du dashboard Render.
#    Les services EXISTENT déjà ( créés via le dashboard ). En cas de
#    divergence, le dashboard gagne. Pour appliquer une évolution (
#    changement de commande, de plan, de healthcheck ), saisissez-la
#    DANS LE DASHBOARD — ce fichier documente l'état attendu.
#
# Rôle unique : serveur web. L'agent vocal n'est plus dans cette image —
# il est déployé sur LiveKit Cloud ( agent `tutor`, projet `live` ).
# Plan free : 512 Mo de RAM, région frankfurt.

services:
  # --------------------------------------------------------------------------
  # API FastAPI — sert le chat clavier + les endpoints /api/livekit/*.
  # --------------------------------------------------------------------------
  - type: web
    name: agent-tutor-api
    runtime: docker
    rootDir: backend
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Pas de dockerCommand : le CMD de l'image lance uvicorn ( rôle API ).
    healthCheckPath: /api/health
    # false : la prod ne se déploie QUE via .github/workflows/deploy.yml
    # ( CI verte → staging vérifié → approbation ). Avec true, chaque push
    # sur master partait en prod avant la CI et sans approbation.
    # ⚠️ À reporter aussi dans le dashboard ( Settings → Auto-Deploy : No ).
    autoDeploy: false
    envVars:
      # Backend.
      - key: AUTH_MODE
        value: neon
      - key: DATABASE_URL
        sync: false
      # ⚠️ OBLIGATOIRE en prod : le navigateur appelle Render DIRECTEMENT
      #    ( cross-origin ), pas via le proxy Vercel — voir ADR-015.
      #    Sans cette variable, CORSMiddleware n'émet aucun en-tête et
      #    TOUTE l'application est bloquée côté navigateur.
      #
      #    ⚠️ VALEUR VÉRIFIÉE EN PRODUCTION le 2026-09-29 ( curl avec
      #    en-tête Origin ). Le dashboard Render fait foi ; ce fichier
      #    DOIT refléter exactement la même liste, sinon le prochain
      #    `render blueprint apply` casse la prod. La valeur ci-dessous
      #    est celle qui répond en 200 aujourd'hui.
      #
      #    Les déploiements de PRÉVISUALISATION Vercel ( domaines
      #    `frontend-<hash>.vercel.app` ) ne sont PAS acceptés :
      #    Starlette ne gère pas les jokers. Tester une branche en
      #    preview suppose d'ajouter son domaine explicitement.
      - key: ALLOWED_ORIGINS
        value: https://frontend-sigma-lilac-62.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      # Modèles LiveKit Inference ( noms valides vérifiés en 1.8.2 ).
      - key: LIVEKIT_AGENT_STT_MODEL
        value: deepgram/nova-3
      - key: LIVEKIT_AGENT_LLM_MODEL
        value: google/gemini-2.5-flash
      # TTS : l'agent est en eu-central, donc la requête part vers la
      # région data `eu` — Rime n'y a pas d'endpoint (REGION_RESTRICTED,
      # l'agent reste muet). Deepgram Aura-2 est servi en EU et parle `fr`.
      - key: LIVEKIT_AGENT_TTS_MODEL
        value: deepgram/aura-2
      - key: LIVEKIT_AGENT_TTS_VOICE
        value: ""
      - key: LIVEKIT_AGENT_LANGUAGE
        value: fr
      # Secrets : `sync: false` = saisis à la main dans le dashboard,
      # JAMAIS commités ici.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      # Cache de l'API ( ADR-006bis ). ABSENT ou vide = repli mémoire
      # TTLCache par process. URL Redis managé ( Upstash, Layerbase )
      # saisie dans le dashboard : `sync: false`, JAMAIS commitée ici.
      - key: REDIS_URL
        sync: false
      # Neon Storage ( S3 ) — bucket "assets" pour les uploads
      # document/image/vidéo. SANS CES VARS, object_store bascule en
      # BYTEA ( trace via OBJECT_STORAGE_S3_FALLBACK ) : ça marche, mais
      # les octets s'entassent en base au lieu d'aller dans le bucket.
      # Credentials saisis à la main ( sync: false = JAMAIS commités ).
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-central-1
      - key: NEON_S3_BUCKET
        value: assets
      # Variables lues par le code, saisies dans le dashboard. Déclarées
      # ici ( sync: false = valeur jamais commitée ) pour que le blueprint
      # décrive TOUT ce dont le service a besoin.
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: ADMIN_EXTERNAL_IDS
        sync: false
      - key: AGENT_SERVICE_SECRET
        sync: false
      - key: OLLAMA_HOST
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: LANGFUSE_ENABLED
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
