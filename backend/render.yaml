# Configuration Render — agent-tutor.
#
# ⚠️ Ce fichier est une SOURCE DE VÉRITÉ en plus du dashboard Render.
#    Les services EXISTENT déjà ( créés via le dashboard ). En cas de
#    divergence, le dashboard gagne. Pour appliquer une évolution (
#    changement de commande, de plan, de healthcheck ), saisissez-la
#    DANS LE DASHBOARD — ce fichier documente l'état attendu.
#
# Une seule image Docker ( ./Dockerfile ), deux rôles selon RUN_AS_WORKER.
# Plan free : 512 Mo de RAM par service, région frankfurt.

services:
  # --------------------------------------------------------------------------
  # API FastAPI — sert le chat clavier + les endpoints /api/livekit/*.
  # --------------------------------------------------------------------------
  - type: web
    name: agent-tutor-api
    runtime: docker
    rootDir: backend
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Pas de dockerCommand : le CMD de l'image lance uvicorn ( rôle API ).
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Rôle : API ( pas le worker ).
      - key: RUN_AS_WORKER
        value: ""
      # Backend.
      - key: AUTH_MODE
        value: neon
      - key: DATABASE_URL
        sync: false
      # ⚠️ OBLIGATOIRE en prod : le navigateur appelle Render DIRECTEMENT
      #    ( cross-origin ), pas via le proxy Vercel — voir ADR-015.
      #    Sans cette variable, CORSMiddleware n'émet aucun en-tête et
      #    TOUTE l'application est bloquée côté navigateur.
      #
      #    ⚠️ VALEUR VÉRIFIÉE EN PRODUCTION le 2026-09-29 ( curl avec
      #    en-tête Origin ). Le dashboard Render fait foi ; ce fichier
      #    DOIT refléter exactement la même liste, sinon le prochain
      #    `render blueprint apply` casse la prod. La valeur ci-dessous
      #    est celle qui répond en 200 aujourd'hui.
      #
      #    Les déploiements de PRÉVISUALISATION Vercel ( domaines
      #    `frontend-<hash>.vercel.app` ) ne sont PAS acceptés :
      #    Starlette ne gère pas les jokers. Tester une branche en
      #    preview suppose d'ajouter son domaine explicitement.
      - key: ALLOWED_ORIGINS
        value: https://frontend-sigma-lilac-62.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      # Modèles LiveKit Inference ( noms valides vérifiés en 1.8.2 ).
      - key: LIVEKIT_AGENT_STT_MODEL
        value: deepgram/nova-3
      - key: LIVEKIT_AGENT_LLM_MODEL
        value: google/gemini-2.5-flash
      - key: LIVEKIT_AGENT_TTS_MODEL
        value: rime/coda
      - key: LIVEKIT_AGENT_TTS_VOICE
        value: aurelie
      - key: LIVEKIT_AGENT_LANGUAGE
        value: fr
      # Secrets : `sync: false` = saisis à la main dans le dashboard,
      # JAMAIS commités ici.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      # Cache partagé API <-> worker vocal ( ADR-006bis ). ABSENT ou vide
      # = repli mémoire TTLCache par process ( chaque service a son
      # cache privé → une invalidation côté API ne touche pas le worker
      # jusqu'à la TTL de 5 min ). URL Redis managé ( Upstash, Layerbase )
      # saisie dans le dashboard : `sync: false`, JAMAIS commitée ici.
      - key: REDIS_URL
        sync: false
      # Neon Storage ( S3 ) — bucket "assets" pour les uploads
      # document/image/vidéo. SANS CES VARS, object_store bascule en
      # BYTEA ( trace via OBJECT_STORAGE_S3_FALLBACK ) : ça marche, mais
      # les octets s'entassent en base au lieu d'aller dans le bucket.
      # Credentials saisis à la main ( sync: false = JAMAIS commités ).
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-central-1
      - key: NEON_S3_BUCKET
        value: assets

  # --------------------------------------------------------------------------
  # Worker LiveKit — le tuteur vocal.
  #
  # Pas de type "worker" Docker sur le plan free : on reste un web_service,
  # mais worker_main.py ouvre UN process qui lance l'AgentServer LiveKit ET
  # un mini-serveur /healthz sur $PORT. Sans port écouté, Render suspend le
  # service → aucun dispatch réclamé → le frontend boucle en reconnexion.
  # --------------------------------------------------------------------------
  - type: web
    name: agent-tutor-worker
    runtime: docker
    rootDir: backend
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.infrastructure.livekit.worker_main
    # /healthz renvoie 200 seulement quand le worker est ENREGISTRÉ auprès
    # de LiveKit : c'est un vrai healthcheck, pas un simple "process vivant".
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: RUN_AS_WORKER
        value: "1"
      # Les credentials LiveKit sont PARTAGÉS avec l'API : c'est l'API qui
      # signe les tokens et crée les dispatchs, c'est le worker qui les
      # réclame. Une clé différente = dispatch créé mais jamais réclamé.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Modèles identiques à l'API ( source unique ).
      - key: LIVEKIT_AGENT_STT_MODEL
        value: deepgram/nova-3
      - key: LIVEKIT_AGENT_LLM_MODEL
        value: google/gemini-2.5-flash
      - key: LIVEKIT_AGENT_TTS_MODEL
        value: rime/coda
      - key: LIVEKIT_AGENT_TTS_VOICE
        value: aurelie
      - key: LIVEKIT_AGENT_LANGUAGE
        value: fr
      # La mémoire du tuteur ( Faits/profil ) est lue par le worker.
      - key: DATABASE_URL
        sync: false
      # Cache partagé avec l'API ( ADR-006bis ) : le worker lit profil et
      # faits, l'API les invalide à l'écriture. SANS Redis partagé, le
      # worker sert un profil périmé jusqu'à 5 min après une mise à jour.
      - key: REDIS_URL
        sync: false
