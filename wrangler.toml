# Cloudflare Workers Configuration
# Agent Control Center - Deploy to Cloudflare Workers
# 
# Usage:
#   npx wrangler dev          # Local development
#   npx wrangler deploy       # Deploy to production
#   npx wrangler secret put   # Set secrets (CF_API_TOKEN, etc.)

name = "agent-control-center"
main = "src/worker.py"
compatibility_date = "2026-09-30"
compatibility_flags = ["python_workers"]

# Build configuration for Python Workers
[build]
command = "pip install -r backend/requirements.txt -t .python_packages"

# Python-specific settings
[build.python]
# Use the same Python version as your local environment
version = "3.11"

# Environment variables (non-sensitive)
[vars]
ENVIRONMENT = "production"
PYTHONPATH = ".:backend"

# AI Binding for Workers AI
[ai]
binding = "AI"

# Durable Objects (for stateful agents, sessions, etc.)
[[durable_objects.bindings]]
name = "AGENT_SESSIONS"
class_name = "AgentSession"

# KV Namespaces for caching, rate limiting, etc.
[[kv_namespaces]]
binding = "CACHE"
id = "<your-kv-namespace-id>"
preview_id = "<your-preview-kv-namespace-id>"

# D1 Database (if using SQLite on edge)
# [[d1_databases]]
# binding = "DB"
# database_name = "agent-db"
# database_id = "<your-d1-database-id>"

# R2 Buckets for file storage
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "agent-assets"

# Service Bindings (for microservices)
# [[services]]
# binding = "LIVEKIT_WORKER"
# service = "livekit-agent-worker"

# Secrets (set via `wrangler secret put SECRET_NAME`)
# - CF_API_TOKEN: Cloudflare API token with Workers AI permissions
# - DATABASE_URL: Neon PostgreSQL connection string
# - LANGFUSE_PUBLIC_KEY: Langfuse public key
# - LANGFUSE_SECRET_KEY: Langfuse secret key
# - CLERK_SECRET_KEY: Clerk secret key
# - OLLAMA_API_KEY: Ollama API key
# - ENCRYPTION_KEY: Fernet encryption key
# - LIVEKIT_API_SECRET: LiveKit API secret
# - DEEPGRAM_API_KEY: Deepgram API key
# - TAVILY_API_KEY: Tavily API key

# Observability
[observability]
enabled = true
head_sampling_rate = 0.1
tail_sampling_rate = 1.0

# Triggers
[triggers]
crons = ["0 * * * *"]  # Hourly cleanup job

# Custom domains (configured in Cloudflare dashboard)
# routes = [
#   { pattern = "api.example.com/*", zone_name = "example.com" }
# ]

# Limits
[limits]
cpu_ms = 50000
memory_mb = 128